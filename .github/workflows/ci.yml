name: MRLB CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npx prisma generate
      - run: npx tsc --noEmit
